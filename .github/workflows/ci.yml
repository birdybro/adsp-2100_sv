name: foundation-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y verilator
      - name: Run repository regression
        run: make test
      - name: Validate formal harnesses
        run: make formal
